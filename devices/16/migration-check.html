<!doctype html><html lang="ja"><meta charset="utf-8"><title>16 旧保存移行の隔離確認</title><style>body{font:16px system-ui}button{padding:15px}iframe{width:98vw;height:65vh}</style><h1>隔離 origin の R1 担当権を確認</h1><p>練習用。旧版保存や本番状態は変更しません。担当権を取得→下の本体を開くと移行保留、解放→再読込で新規採用。</p><button id="hold">旧版担当権を保持</button><button id="release">解放</button><button id="open">本体を読み込む</button><output id="status">未保持</output><iframe title="移行確認用16本体"></iframe><script type="module">let release;const out=document.querySelector('output');document.querySelector('#hold').onclick=()=>navigator.locks.request('cytospin16-principle-r1',{ifAvailable:true},async lock=>{if(!lock){out.textContent='取得できません';return}out.textContent='R1担当権保持中';await new Promise(r=>release=r);out.textContent='解放済み'});document.querySelector('#release').onclick=()=>release?.();document.querySelector('#open').onclick=()=>document.querySelector('iframe').src='/';window.addEventListener('pagehide',()=>release?.());</script></html>
