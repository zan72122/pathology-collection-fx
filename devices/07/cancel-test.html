<!doctype html><html lang=ja><meta charset=utf-8><title>07 隔離入力取消試験</title><style>body{font:14px system-ui}iframe{width:100%;height:680px}pre{white-space:pre-wrap}button{padding:12px}</style><h1>合成イベントの隔離取消試験</h1><p>localhost専用。通常3D入力証拠とは別。状態は書き換えず、開始キーへのdownとcancel/blurを送る。</p><button id=cancel>開始キー取消</button><button id=blur>開始キーフォーカス喪失</button><pre id=result>未実行</pre><iframe id=frame src="/"></iframe><script>
const frame=document.getElementById('frame'),out=document.getElementById('result');function run(kind){try{const w=frame.contentWindow,d=w.document,canvas=d.getElementById('scene'),qa=()=>JSON.parse(d.getElementById('qa').textContent),state=()=>d.getElementById('state').textContent,before=state(),p=qa().points.start;canvas.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:73,clientX:p[0],clientY:p[1],button:0,buttons:1,isPrimary:true,pointerType:'mouse'}));const acquired=qa().gestureActive;if(kind==='cancel')canvas.dispatchEvent(new w.PointerEvent('pointercancel',{bubbles:true,pointerId:73,clientX:p[0],clientY:p[1],button:0,buttons:0,isPrimary:true,pointerType:'mouse'}));else w.dispatchEvent(new w.Event('blur'));const after=state();out.textContent=JSON.stringify({kind,acquired,passed:acquired&&before===after,before,after,qa:qa()},null,2);}catch(e){out.textContent='ERROR '+e;}}document.getElementById('cancel').onclick=()=>run('cancel');document.getElementById('blur').onclick=()=>run('blur');
</script></html>
