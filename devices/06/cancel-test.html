<!doctype html><html lang=ja><meta charset=utf-8><title>06 隔離入力境界試験</title><style>body{margin:0;font:14px system-ui}iframe{width:100%;height:680px;border:0}pre{white-space:pre-wrap}button{padding:12px}</style><h1>隔離・合成イベント試験（通常入力の証拠とは別）</h1><p>localhost originだけで実行。127.0.0.1の通常保存とは分離。</p><button id=cancel>容器取消を試験</button><button id=blur>採水blurを試験</button><button id=probe>フォーカス先</button><pre id=result>未実行</pre><iframe id=frame src="/"></iframe><script>
const frame=document.getElementById('frame'),out=document.getElementById('result');
function ctx(){const w=frame.contentWindow,d=w.document;return {w,d,canvas:d.getElementById('scene'),qa:()=>JSON.parse(d.getElementById('qa').textContent),state:()=>JSON.parse(d.getElementById('state').textContent)};}
function event(x,type,p,id){x.canvas.dispatchEvent(new x.w.PointerEvent(type,{bubbles:true,pointerId:id,clientX:p[0],clientY:p[1],button:0,buttons:type==='pointerdown'?1:0,isPrimary:true,pointerType:'mouse'}));}
document.getElementById('cancel').onclick=()=>{try{const x=ctx(),before=x.state(),p=x.qa().points.cup;event(x,'pointerdown',p,73);const acquired=x.qa().cupGestureActive;event(x,'pointercancel',p,73);const after=x.state(),passed=acquired&&JSON.stringify(before)===JSON.stringify(after)&&!x.qa().cupGestureActive;out.textContent=JSON.stringify({test:'synthetic-cup-cancel',passed,acquired,before,after,qa:x.qa()},null,2);}catch(e){out.textContent='ERROR '+e;}};
document.getElementById('blur').onclick=()=>{try{const x=ctx();if(x.d.getElementById('power').textContent.includes('ON'))x.d.getElementById('power').click();x.canvas.addEventListener('pointerdown',e=>{setTimeout(()=>{const acquired=x.qa().activePointer===e.pointerId;x.d.getElementById('power').focus();const after=x.state(),last=after.events.at(-1),passed=acquired&&last?.kind==='interrupt'&&last.reason==='blur'&&x.qa().activePointer===null;out.textContent=JSON.stringify({test:'actual-pointer-injected-focus-loss',passed,acquired,after,qa:x.qa()},null,2);},100);},{once:true});out.textContent='ARMED: frame内の3D上端ボタンを400ms以上保持';}catch(e){out.textContent='ERROR '+e;}};
</script></html>
